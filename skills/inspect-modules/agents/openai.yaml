interface:
  display_name: "Inspect Modules"
  short_description: "Use this skill when the user wants to understand the dependencies between modules in a codebase. The skill will provide a high-level overview of how different modules interact with each other, including any direct or indirect dependencies. Only use this skill when the user explicitly types /inspect-modules. Do not trigger on descriptive requests like 'analyze this repo's module dependencies,' 'what are the module dependencies' questions — wait for the explicit command."
policy:
  allow_implicit_invocation: false
