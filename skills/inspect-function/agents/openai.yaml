interface:
  display_name: "Inspect Repo"
  short_description: "Use this skill when the user wants to understand the purpose and behavior of a specific function in the codebase — its inputs, outputs, side effects, and any dependencies or related functions that are relevant to understanding its role within the codebase. Only use this skill when the user explicitly types /inspect-function <function_name>. Do not trigger on descriptive requests like 'analyze this function,' 'what does this function do' questions — wait for the explicit command."
policy:
  allow_implicit_invocation: false
